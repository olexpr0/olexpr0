<svg xmlns="http://www.w3.org/2000/svg" width="420" height="76" viewBox="0 0 420 76" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-labelledby="t d"><title id="t">Open portfolio</title><desc id="d">Button linking to the portfolio.</desc><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12151f" stroke-width="1"/></pattern>
<radialGradient id="aura"><stop offset="0" stop-color="#d4ff3a" stop-opacity=".30"/><stop offset="1" stop-color="#d4ff3a" stop-opacity="0"/></radialGradient>
<linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#d4ff3a"/><stop offset=".5" stop-color="#7df9ff"/><stop offset="1" stop-color="#ff5a1f"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/></linearGradient></defs><rect x="4" y="4" width="412" height="68" rx="34.0" fill="#07080c" stroke="url(#bd)" stroke-width="2.5"/><text x="196.0" y="44.0" font-size="18" font-weight="700" text-anchor="middle" fill="#e8ecf4" letter-spacing="2">OPEN THE PORTFOLIO</text><text x="368" y="45.0" font-size="22" font-weight="700" fill="#d4ff3a">→<animate attributeName="x" values="364;374;364" dur="1.4s" repeatCount="indefinite"/></text></svg>
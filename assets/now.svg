city" values="1;.2;1" dur="2.0s" repeatCount="indefinite"/></circle><text x="832" y="100" font-size="14" fill="#e8ecf4">Rust</text><rect x="975" y="78" width="160" height="34" rx="17" fill="#0c0e14" stroke="#ff5a1f" stroke-dasharray="4 4" stroke-opacity=".8"/><circle cx="993" cy="95" r="3.5" fill="#ff5a1f"><animate attributeName="opacity" values="1;.2;1" dur="2.3s" repeatCount="indefinite"/></circle><text x="1007" y="100" font-size="14" fill="#e8ecf4">C++</text><rect x="800" y="122" width="160" height="34" rx="17" fill="#0c0e14" stroke="#ff5a1f" stroke-dasharray="4 4" stroke-opacity=".8"/><circle cx="818" cy="139" r="3.5" fill="#ff5a1f"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><text x="832" y="144" font-size="14" fill="#e8ecf4">Kotlin</text><rect x="975" y="122" width="160" height="34" rx="17" fill="#0c0e14" stroke="#ff5a1f" stroke-dasharray="4 4" stroke-opacity=".8"/><circle cx="993" cy="139" r="3.5" fill="#ff5a1f"><animate attributeName="opacity" values="1;.2;1" dur="2.9s" repeatCount="indefinite"/></circle><text x="1007" y="144" font-size="14" fill="#e8ecf4">React Native</text><rect x="800" y="166" width="160" height="34" rx="17" fill="#0c0e14" stroke="#ff5a1f" stroke-dasharray="4 4" stroke-opacity=".8"/><circle cx="818" cy="183" r="3.5" fill="#ff5a1f"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle><text x="832" y="188" font-size="14" fill="#e8ecf4">MongoDB</text><rect x="975" y="166" width="160" height="34" rx="17" fill="#0c0e14" stroke="#ff5a1f" stroke-dasharray="4 4" stroke-opacity=".8"/><circle cx="993" cy="183" r="3.5" fill="#ff5a1f"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle><text x="1007" y="188" font-size="14" fill="#e8ecf4">Redis</text></g></svg>
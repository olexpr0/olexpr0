<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-labelledby="t d"><title id="t">Alex Blitz</title><desc id="d">Animated banner: Alex Blitz, full-stack developer building agents and automation.</desc><defs>

name: profile-agent

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "profile-agent"
          git config user.email "profile-agent@users.noreply.github.com"
          git add assets data
          git diff --cached --quiet || git commit -m "chore: redraw profile svgs"
          git push
